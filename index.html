<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1b4d">
<title>TFG Admin</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#101828;--mute:#667085;--line:#e4e7ef;--brand:#1f5eff;--soft:#eaf0ff;--warn:#b42318;--warnbg:#fdecea;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0c1018;--card:#161b26;--ink:#eef1f6;--mute:#9aa4b8;--line:#252c3b;--brand:#7aa0ff;--soft:#1b2640;--warn:#ff8a80;--warnbg:#3a1d1b;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#0b1b4d,#1f5eff);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:0;background:rgba(255,255,255,.16);color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;display:grid;place-items:center}
.ib[hidden]{display:none}
.ib{position:relative}
#dot{position:absolute;top:7px;right:8px;width:10px;height:10px;border-radius:50%;background:#ff4d4f;border:2px solid #1f5eff}
#sheetscrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s;z-index:40}
#sheetscrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:75vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));z-index:41;transform:translateY(105%);transition:transform .22s ease;box-shadow:var(--shadow)}
#sheet.on{transform:none}
.empty{text-align:center;padding:28px 10px;color:var(--mute)}
.empty .big{font-size:34px;display:block;margin-bottom:6px}
.nitem{display:flex;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
main{padding:16px 16px 40px;max-width:780px;margin:0 auto}
.hero{background:linear-gradient(135deg,#0b1b4d,#1f5eff);color:#fff;border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0;opacity:.85;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:rgba(255,255,255,.14);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;opacity:.85}
h3{margin:22px 4px 10px;font-size:13px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);width:100%;text-align:left}
button.card:active{transform:scale(.99)}
.proj{display:flex;gap:12px;align-items:center}
.av{flex:0 0 46px;height:46px;border-radius:14px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.proj h2{margin:0;font-size:16px}
.muted{color:var(--mute);font-size:13px}
.num{font-size:12px;color:var(--mute);font-weight:700}
.chev{margin-left:auto;color:var(--mute);font-size:20px}
.pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--brand);margin:6px 6px 0 0;font-weight:600}
.pill.soon{background:var(--line);color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.feat{display:flex;gap:12px;align-items:center}
.feat .av{background:var(--soft);color:var(--brand)}
input[type=search]{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:0 0 12px;box-shadow:var(--shadow)}
.col{display:inline-block;font:13px ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 9px;margin:4px 5px 0 0}
.col.sens{background:var(--warnbg);border-color:transparent;color:var(--warn)}
.note{border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;background:var(--soft)}
.note.warn{background:var(--warnbg);color:var(--warn)}
.banner{border-radius:20px;padding:18px;color:#fff;margin-bottom:14px;box-shadow:var(--shadow)}
.banner h2{margin:0;font-size:20px}.banner p{margin:4px 0 0;opacity:.9;font-size:14px}
.banner .pill{background:rgba(255,255,255,.22);color:#fff}
.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px}
.mini div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.mini b{display:block;font-size:20px}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.2s;z-index:30}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,330px);background:var(--card);z-index:31;transform:translateX(-102%);transition:transform .22s ease;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#drawer.on{transform:none}
.dh{background:linear-gradient(135deg,#0b1b4d,#1f5eff);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 16px}
.dh b{font-size:20px}.dh div{opacity:.85;font-size:13px}
.dl{overflow:auto;padding:10px;flex:1}
.ni{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px;border-radius:14px;text-align:left}
.ni.on{background:var(--soft)}
.ni .av{flex-basis:36px;height:36px;border-radius:11px;font-size:14px}
.ni small{display:block;color:var(--mute);font-size:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;white-space:nowrap;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pill.ok{background:#e3f6ec;color:#067647}.pill.bad{background:var(--warnbg);color:var(--warn)}.pill.warn{background:#fff3d6;color:#9a6700}
@media (prefers-color-scheme:dark){.pill.ok{background:#12301f;color:#4cd08a}.pill.warn{background:#3a2e10;color:#f2c24f}}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-weight:700;background:var(--brand);color:#fff;margin-top:10px}
.btn.danger{background:#d92d20}.btn.ghost{background:var(--soft);color:var(--brand)}
textarea{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:10px;margin-top:8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.kv:last-child{border:0}.kv span:first-child{color:var(--mute)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:#101828;color:#fff;padding:11px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;max-width:88vw;font-size:14px;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.sel{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:4px 0 4px}
.sep{height:1px;background:var(--line);margin:8px 6px}
.ghb{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;white-space:pre-wrap}.ghl{font-weight:700;font-size:12px;text-transform:uppercase;color:var(--brand);margin-bottom:4px}.ghl.ch{color:#b54708}.fi{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:4px 0 10px}.fl{font-size:12px;color:var(--mute);font-weight:700}
</style>
</head>

function stuSheet(tab,id){
  const x=STU[tab].find(r=>r.id==id);
  const kv=(k,v)=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`;
  const done=m=>{sheet(false);students();toast('Sample only: '+m+'. No real record was changed.')};
  const decide=(label,field,fn)=>`<button class="btn ${field}" id="${label}">${fn}</button>`;
  let h='';
  if(tab=='students'){
    h=kv('Student number',x.nid)+kv('Class',x.cls)+kv('Gender',x.gender)+kv('Date of birth',x.dob)+kv('Status',pill2(x.status))+kv('Guardian',`${esc(x.guardian)} (${esc(x.rel)})`)+kv('Guardian phone',x.phone);
    h+=x.status=='active'?`<button class="btn danger" id="b1">Suspend student</button><button class="btn ghost" id="b2">Move to trash</button>`:x.status=='trash'?`<button class="btn" id="b1">Restore student</button>`:`<button class="btn" id="b1">Reactivate student</button>`;
    showSheet(x.name,h);
    if($('b1'))$('b1').onclick=()=>{x.status=x.status=='active'?'suspended':'active';done(x.name+' is now '+x.status)};
    if($('b2'))$('b2').onclick=()=>{x.status='trash';done(x.name+' moved to trash')};
  }
  if(tab=='adm'){
    h=kv('Application',x.no)+kv('Applying for',x.cls)+kv('Previous school',esc(x.prev))+kv('Guardian',esc(x.guardian))+kv('Phone',x.phone)+kv('Status',pill2(x.status))+(x.note?kv('Decision note',esc(x.note)):'');
    if(x.status=='pending')h+=`<textarea id="nt" placeholder="Decision note (required to reject)"></textarea><button class="btn" id="ok">Approve admission</button><button class="btn danger" id="no">Reject</button>`;
    showSheet(x.name,h);
    if($('ok'))$('ok').onclick=()=>{x.status='approved';x.note=$('nt').value.trim()||'Approved';done(x.name+' approved')};
    if($('no'))$('no').onclick=()=>{const n=$('nt').value.trim();if(!n){toast('Write a note to reject');return}x.status='rejected';x.note=n;done(x.name+' rejected')};
  }
  if(tab=='trf'){
    h=kv('From',esc(x.from))+kv('To',esc(x.to))+kv('From class',x.fc)+kv('To class',x.tc)+kv('Fee balance',money(x.bal))+kv('Balance',pill2(x.cleared?'cleared':'owing'));
    if(!x.cleared)h+=`<button class="btn" id="cl">Mark balance cleared</button>`;
    showSheet(x.name,h);
    if($('cl'))$('cl').onclick=()=>{x.cleared=true;x.bal=0;done('balance cleared for '+x.name)};
  }
  if(tab=='pro'){
    h=kv('From class',x.from)+kv('To class',x.to)+kv('Action',pill2(x.action))+kv('Academic year',x.year)+`<div class="muted" style="margin-top:10px">Promotions are a record only. They are read-only here.</div>`;
    showSheet(x.name,h);
  }
  if(tab=='cor'){
    h=kv('Requested change',esc(x.changes))+kv('Reason',esc(x.reason))+kv('Status',pill2(x.status))+(x.note?kv('Decision note',esc(x.note)):'');
    if(x.status=='pending')h+=`<textarea id="nt" placeholder="Decision note (required to reject)"></textarea><button class="btn" id="ok">Approve correction</button><button class="btn danger" id="no">Reject</button>`;

  }
}

const gTab={},gQ={};
function gscreen(key){
  const S=GS[key];setHead(S.title,false);
  const tab=gTab[key]||S.tabs[0].k,T=S.tabs.find(t=>t.k==tab),q=(gQ[key]||'').toLowerCase();
  const items=T.items.filter(x=>!q||JSON.stringify(x).toLowerCase().includes(q));
  let h=`<div class="note">Sample data. The login is not added yet, so nothing here touches your real records.</div>`;
  if(S.stats)h+=`<div class="mini" style="grid-template-columns:repeat(${S.stats().length},1fr)">${S.stats().map(a=>`<div><b style="font-size:17px">${a[1]}</b><span class="muted">${a[0]}</span></div>`).join('')}</div>`;
  h+=`<div class="chips" style="margin-top:10px">${S.tabs.map(t=>`<button class="chip ${t.k==tab?'on':''}" data-tab="${t.k}">${t.l} (${t.items.length})</button>`).join('')}</div>`;
  if(T.add)h+=`<button class="btn" id="gadd" style="margin:0 0 12px">${T.add.l}</button>`;
  h+=`<input type="search" id="gq" placeholder="Search" value="${esc(gQ[key]||'')}"><div class="grid">`;
  h+=items.map(x=>{const c=T.card(x);return `<button class="card proj" data-id="${x.id}"><span class="av" style="background:${appBy(S.app||'school-manager').color}">${esc(c.av||initials(c.t))}</span><span style="flex:1;min-width:0"><h2 style="margin:0">${esc(c.t)}</h2><span class="muted">${esc(c.s||'')}</span>${c.p?`<br>${c.p}`:''}</span><span class="chev">&#8250;</span></button>`}).join('')||'<div class="muted" style="padding:12px">Nothing here.</div>';
  app.innerHTML=h+`</div>`;
  const redo=()=>gscreen(key);
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{gTab[key]=b.dataset.tab;gQ[key]='';redo()});
  $('gq').oninput=e=>{gQ[key]=e.target.value;const p=e.target.selectionStart;redo();const el=$('gq');el.focus();el.setSelectionRange(p,p)};
  app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{
    const x=T.items.find(r=>String(r.id)==b.dataset.id),kv=(k,v)=>`<div class="kv"><span>${k}</span><span>${v}</span></div>`;
    const acts=(T.actions?T.actions(x):[]),needNote=acts.some(a=>a.note);
    showSheet(T.card(x).t,T.detail(x).map(a=>kv(a[0],a[1])).join('')+(needNote?`<textarea id="gnote" placeholder="${esc(acts.find(a=>a.note).ph||'Note')}"></textarea>`:'')+acts.map((a,i)=>`<button class="btn ${a.c||''}" data-a="${i}">${a.l}</button>`).join(''));
    document.querySelectorAll('#nlist [data-a]').forEach(btn=>btn.onclick=()=>{
      const a=acts[+btn.dataset.a],note=needNote?$('gnote').value.trim():'';
      if(a.note=='required'&&!note){toast('Please write a note first');return}
      const m=a.run(x,note);sheet(false);redo();toast('Sample only: '+m+'. No real record was changed.');
    });
  });
  if($('gadd'))$('gadd').onclick=()=>{
    const A=T.add;
    showSheet(A.l,A.fields.map(f=>`<div class="muted" style="margin-top:8px">${f.l}</div>`+(f.o?`<select id="g_${f.k}" class="sel">${(typeof f.o=='function'?f.o():f.o).map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:`<input type="search" id="g_${f.k}" ${f.n?'inputmode="numeric"':''} placeholder="${esc(f.ph||'')}">`)).join('')+`<button class="btn" id="gsave">Save</button>`);
    $('gsave').onclick=()=>{const v={};for(const f of A.fields){v[f.k]=$('g_'+f.k).value.trim();if(!v[f.k]){toast('Fill in: '+f.l);return}if(f.n)v[f.k]=parseInt(v[f.k].replace(/\D/g,''),10)||0}
      T.items.unshift(Object.assign({id:'n'+Date.now()},A.make(v)));sheet(false);redo();toast('Sample only: saved on screen. No real record was changed.')};
  };
}

function sectionsHTML(p,i){
  const S=SECTIONS[p.slug];if(!S)return '';
  return `<h3>Sections</h3><div class="grid">`+S.map((x,n)=>`<button class="card proj" data-sec="${n}"><span class="av" style="background:${p.color}">${x.icon}</span><span style="flex:1;min-width:0"><h2 style="margin:0">${esc(x.name)}</h2><span class="muted">${esc(x.desc)}</span><br><span class="pill">${x.tables.length} ${x.tables.length==1?'table':'tables'}</span></span><span class="chev">&#8250;</span></button>`).join('')+`</div>`;
}
function section(i,n){
  const p=DATA[i],x=SECTIONS[p.slug][n];setHead(x.name,true);
  const known=x.tables.filter(t=>p.tables.some(q=>q[0]==t));
  app.innerHTML=`<div class="banner" style="background:${p.color}"><h2>${esc(x.name)}</h2><p>${esc(x.desc)}</p><span class="pill">${esc(p.name)}</span></div>`
   +(x.screen?`<button class="card feat" id="scr" style="margin-bottom:12px"><span class="av">&#9654;</span><span><h2 style="margin:0;font-size:16px">Open management screen</h2><span class="muted">${['gh_songs','sh_creators','ds_schools','ds_requests','schools','gh_updates','gh_believers','gh_safety','gh_activity','sh_content','sh_community','sh_support','sh_admin'].includes(x.screen)&&LOGIN_ON?'Live data: sign in with your owner account':'Ready (sample data until login)'}</span></span><span class="chev">&#8250;</span></button>`:`<div class="note">Management screen for this section is not built yet. Tell me to build it next.</div>`)

  if($('scr'))$('scr').onclick=()=>nav({t:x.screen});
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>nav({t:'table',p:i,j:+b.dataset.j}));
}

function project(i){
  const p=DATA[i];setHead(p.name,false);
  const sens=p.tables.reduce((n,t)=>n+t[1].filter(c=>SENS.test(c)).length,0);
  app.innerHTML=`<div class="banner" style="background:${p.color}"><h2>${esc(p.name)}</h2><p>${esc(p.desc)}</p>${p.apps.map(a=>`<span class="pill">${esc(a)}</span>`).join('')}${p.inactive?'<span class="pill">Inactive</span>':''}</div><button class="btn ${p.inactive?'':'ghost'}" id="actb" style="margin:0 0 12px">${p.inactive?'Activate project':'Mark project inactive'}</button><div class="mini"><div><b>${p.tables.length}</b><span class="muted">Tables</span></div><div><b>${sens}</b><span class="muted">Sensitive columns</span></div></div><div class="muted" style="margin:8px 4px 0">${esc(p.account)} · ref ${esc(p.ref)}</div>${sectionsHTML(p,i)}<h3>All tables</h3><input type="search" id="q" placeholder="Search tables or columns"><div class="grid" id="list"></div>`;
  const list=$('list');
  const draw=q=>{
    q=q.trim().toLowerCase();
    const rows=p.tables.map((t,j)=>[t,j]).filter(([t])=>!q||t[0].includes(q)||t[1].some(c=>c.toLowerCase().includes(q)));
    list.innerHTML=rows.map(([t,j])=>`<button class="card" data-t="${j}"><div class="row"><b>${esc(t[0])}</b><span class="muted">${t[1].length} cols &#8250;</span></div></button>`).join('')||'<div class="muted">No match</div>';
    list.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>nav({t:'table',p:i,j:+b.dataset.t}));
  };
  $('q').oninput=e=>draw(e.target.value);draw('');
  $('actb').onclick=()=>{if(!ses.a){gate();return}const to=p.inactive?'active':'inactive';api({action:'apps.set_status',slug:p.slug,status:to}).then(()=>{p.inactive=!p.inactive;project(i);toast(p.inactive?'Project marked inactive':'Project is active')}).catch(e=>toast(e.message))};
  app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>nav({t:'section',p:i,n:+b.dataset.sec}));
}
function table(i,j){
  const p=DATA[i],t=p.tables[j];setHead(t[0],true);
  const has=t[1].some(c=>SENS.test(c));
  app.innerHTML=`<div class="muted" style="margin:0 4px 10px">${esc(p.name)} · ${t[1].length} columns</div>`+(has?`<div class="note warn">Red columns hold sensitive data. TFG Admin will never read or show them.</div>`:'')+`<div class="card">`+t[1].map(c=>`<span class="col ${SENS.test(c)?'sens':''}">${esc(c)}</span>`).join('')+`</div>`;
}

/* ---- Splits pasted lyrics into "Verse N" and "Chorus" blocks ---- */
const GH_CH_ONLY=/^\s*[\[(]?\s*(chorus|refrain|cho|ch)\.?\s*\d*\s*[\])]?\s*:?\s*$/i;
const GH_CH_TXT=/^\s*[\[(]?\s*(chorus|refrain)\s*[\])]?\s*:\s*(\S.*)$/i;
const GH_V_ONLY=/^\s*[\[(]?\s*(verse|vs|v|stanza)\.?\s*(\d+)?\s*[\])]?\s*:?\s*$/i;
const GH_V_TXT=/^\s*(verse|stanza)\s*(\d+)\s*[:.\-]\s*(\S.*)$/i;
const GH_NUM_ONLY=/^\s*(\d{1,2})\s*[.)]?\s*$/;
const GH_NUM_TXT=/^\s*(\d{1,2})\s*[.)]\s+(\S.*)$/;
const ghNorm=s=>s.toLowerCase().replace(/[^\p{L}\p{N} ]+/gu,' ').replace(/\s+/g,' ').trim();
function ghLabel(line){
  let m;
  if(GH_CH_ONLY.test(line))return {t:'c',rest:null};
  if(m=GH_CH_TXT.exec(line))return {t:'c',rest:m[2]};
  if(GH_V_ONLY.test(line))return {t:'v',rest:null};
  if(m=GH_V_TXT.exec(line))return {t:'v',rest:m[3]};
  if(GH_NUM_ONLY.test(line))return {t:'v',rest:null};
  if(m=GH_NUM_TXT.exec(line))return {t:'v',rest:m[2]};
  return null}
function ghParse(raw,hint){
  hint=hint||{};
  const lines=String(raw||'').replace(/\r/g,'').replace(/\t/g,' ').split('\n').map(l=>l.replace(/\s+$/,''));
  // 0. a first line like "12. Title" (followed by a blank line or a Verse/Chorus label) is the title
  let title=hint.title||'',num=hint.num||'';
  {const i0=lines.findIndex(l=>l.trim());
   if(i0>=0){const m=GH_NUM_TXT.exec(lines[i0]);
     const nx=lines.slice(i0+1).findIndex(l=>l.trim());
     const nextLab=nx>=0?ghLabel(lines[i0+1+nx]):null;
     if(m&&(nx!==0||(nextLab&&nextLab.t))){if(!num)num=m[1];if(!title)title=m[2].trim();lines.splice(i0,1)}}}
  // 1. cut into blocks: blank line or a label line starts a new block
  const blocks=[];let cur=null;
  const flush=()=>{if(cur&&(cur.lines.length||cur.t))blocks.push(cur);cur=null};
  for(const ln of lines){
    if(!ln.trim()){flush();continue}
    const lab=ghLabel(ln);
    if(lab){flush();cur={t:lab.t,lines:lab.rest?[lab.rest.trim()]:[]}}
    else{if(!cur)cur={t:null,lines:[]};cur.lines.push(ln.trim())}}
  flush();
  // 2. title / number from a lone first line
  if(blocks.length>=2&&!blocks[0].t&&blocks[0].lines.length==1){
    let t=blocks[0].lines[0],m=/^\s*(\d{1,4})\s*[.)\-]\s*(.+)$/.exec(t);
    if(m){if(!num)num=m[1];t=m[2]}
    if(!title)title=t.replace(/^["'\u201c]|["'\u201d]$/g,'').trim();
    blocks.shift()}
  // 3. a label with no lines attaches to the next block (or is a "repeat chorus" marker)
  const merged=[];let pend=null,haveChorus=false;
  for(const b of blocks){
    if(b.t&&!b.lines.length){
      if(b.t=='c'&&haveChorus){continue}
      pend=b.t;continue}
    if(pend&&!b.t){b.t=pend}
    pend=null;
    if(b.t=='c')haveChorus=true;
    merged.push(b)}
  // 4. repeated unlabeled blocks are the chorus
  const key=b=>ghNorm(b.lines.join(' '));
  const count={};merged.forEach(b=>{const k=key(b);count[k]=(count[k]||0)+1});
  const choKeys=new Set(merged.filter(b=>b.t=='c').map(key));
  merged.forEach(b=>{if(!b.t){const k=key(b);if(choKeys.has(k)||count[k]>1){b.t='c';choKeys.add(k)}}});
  // 5. build output; a chorus is written once
  const out=[],seen=new Set();let v=0,verses=0,choruses=0;
  merged.forEach(b=>{
    if(b.t=='c'){const k=key(b);if(seen.has(k))return;seen.add(k);choruses++;out.push('Chorus\n'+b.lines.join('\n'))}
    else{v++;verses++;out.push('Verse '+v+'\n'+b.lines.join('\n'))}});
  const warn=[];
  if(blocks.length<=1&&lines.filter(l=>l.trim()).length>8)warn.push('No blank lines were found between verses, so everything became one verse. Put a blank line between verses, or write "Verse 2" / "Chorus" on their own lines, then split again.');
  return {title,num,out:out.join('\n\n'),verses,choruses,warn}}

  <div class="fl">Number</div><input class="fi" id="gf_n" type="number" min="1" inputmode="numeric" value="${esc(f.num)}" ${edit?'disabled':''}>
  <div class="fl">Title</div><input class="fi" id="gf_t" value="${esc(f.title)}">
  <div class="fl">Key (for example G)</div><input class="fi" id="gf_k" value="${esc(f.key)}" maxlength="6">
  ${edit?'':`<div class="fl">Paste the lyrics here</div><textarea id="gf_r" rows="9" placeholder="Paste the full song. Leave a blank line between verses. If the title is the first line on its own, it will be picked up.">${esc(f.raw)}</textarea>
  <button class="btn ghost" id="gf_s">Split into verses and chorus</button>`}
  <div id="gf_i" class="muted" style="margin-top:8px">${esc(f.info)}</div>
  <div id="gf_o">${f.out?`<div class="fl" style="margin-top:12px">Preview (what will be saved)</div><div id="gf_p">${ghPrevHTML(f.out)}</div><div class="fl" style="margin-top:12px">Fix the text if needed</div><textarea id="gf_x" rows="10">${esc(f.out)}</textarea>`:''}</div>
  <button class="btn" id="gf_save" ${f.out?'':'disabled style="opacity:.5"'}>${edit?'Save changes':'Save song'}</button>
  <button class="btn ghost" id="gf_c">Cancel</button></div>`;
  const sync=()=>{f.num=$('gf_n').value;f.title=$('gf_t').value;f.key=$('gf_k').value;if($('gf_r'))f.raw=$('gf_r').value};
  ['gf_n','gf_t','gf_k'].forEach(i=>$(i).oninput=sync);if($('gf_r'))$('gf_r').oninput=sync;
  if($('gf_x'))$('gf_x').oninput=e=>{f.out=e.target.value;$('gf_p').innerHTML=ghPrevHTML(f.out)};
  if($('gf_s'))$('gf_s').onclick=()=>{sync();
    if(!f.raw.trim()){toast('Paste the lyrics first');return}
    const r=ghParse(f.raw,{title:f.title.trim(),num:''});
    if(!r.out){f.info='Nothing could be read from that text.';ghForm();return}
    if(r.title&&!f.title.trim())f.title=r.title;
    f.out=r.out;f.info=`Found ${r.verses} verse${r.verses==1?'':'s'}${r.choruses?` and ${r.choruses} chorus`:' and no chorus'}. Check the preview, then save.${r.warn.length?' '+r.warn.join(' '):''}`;
    ghForm();window.scrollTo(0,document.body.scrollHeight*0.25)};
  $('gf_c').onclick=()=>{ghS.mode='list';ghLive()};
  $('gf_save').onclick=async()=>{
    sync();const num=parseInt(f.num,10);
    if(!f.title.trim()){toast('Enter the title');return}
    if(!edit&&!(num>=1)){toast('Enter the song number');return}
    if(!f.out.trim()){toast('Split the lyrics first');return}
    $('gf_save').disabled=true;$('gf_save').textContent='Saving…';
    try{
      if(edit)await api({action:'songs.update',id:f.id,song:{title:f.title,key:f.key,lyrics:f.out}});
      else await api({action:'songs.add',lang:ghS.lang,songs:[{num,title:f.title,key:f.key,lyrics:f.out}]});
      ghS.mode='list';ghS.songs=null;ghS.langs=null;toast('Saved to the real hymn book');ghLive();
    }catch(e){$('gf_save').disabled=false;$('gf_save').textContent=edit?'Save changes':'Save song';f.info='Not saved: '+e.message;$('gf_i').textContent=f.info;toast('Not saved')}}}

const LV={};
const lvAct=(body,msg,reload)=>api(body).then(()=>{sheet(false);toast(msg);reload()}).catch(e=>toast(e.message));
const lvTa=(id,ph,v)=>`<textarea id="${id}" placeholder="${esc(ph)}">${esc(v||'')}</textarea>`;
const lvIn=(id,l,v,t)=>`<div class="fl">${esc(l)}</div><input class="fi" id="${id}" type="${t||'text'}" value="${esc(v==null?'':v)}">`;
function lvScreen(key,cfg){
  return function(){
    setHead(cfg.title,hist.length>0);
    if(!ses.a){gate();return}
    const S=LV[key]=LV[key]||{tab:cfg.tabs?cfg.tabs[0][0]:'',data:{},q:''};
    const reload=()=>{S.data={};fn()};
    const fn=()=>{
      const t=S.tab;
      if(!S.data[t]){app.innerHTML='<div class="empty">Loading…</div>';cfg.load(t).then(d=>{S.data[t]=d;fn()}).catch(e=>liveErr(e,()=>{S.data={};fn()}));return}
      const all=S.data[t],ql=S.q.toLowerCase(),rows=all.filter(x=>!ql||JSON.stringify(x).toLowerCase().includes(ql));
      app.innerHTML=(cfg.tabs?chipsH(cfg.tabs.map(([k,l])=>[k,l+(S.data[k]?' ('+S.data[k].length+')':'')]),t,'t'):'')+(cfg.top?cfg.top(t,all):'')
       +`<input type="search" id="lv_q" placeholder="Search" value="${esc(S.q)}"><div class="grid" style="margin-top:10px">`
       +(rows.length?rows.map((x,i)=>{const c=cfg.card(x,t);return `<button class="card" data-i="${i}"><div class="row"><b>${esc(c[0])}</b>${c[2]?lvPill(c[2],c[3]):''}</div><div class="muted">${esc(c[1]||'')}</div></button>`}).join(''):'<div class="empty">Nothing here</div>')+'</div>';
      app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;S.q='';fn()});
      $('lv_q').oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;fn();const n=$('lv_q');n.focus();try{n.setSelectionRange(p,p)}catch(x){}};
      app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>cfg.open(rows[+b.dataset.i],t,reload));
      if(cfg.bind)cfg.bind(t,reload)};
    fn()}}

  const pend=reqs.filter(r=>r.status=='pending');
  let h=`<div class="card"><h3>Correction requests</h3><span class="pill ${pend.length?'warn':'ok'}">${pend.length} pending</span><span class="pill soon">${pars.length} parents</span></div><div class="grid" style="margin-top:12px">`;
  h+=reqs.length?reqs.map(r=>`<div class="card"><b>${esc(PHF[r.field]||r.field)}</b> <span class="pill ${r.status=='pending'?'warn':r.status=='approved'?'ok':'bad'}">${esc(r.status)}</span><div class="muted">${esc(r.no)} - ${esc(r.date)}</div><p>${esc(r.value)}</p><div class="muted">${esc(r.parent_name)} (${esc(r.parent_code)}) - ${esc(r.phone)}</div>${r.note?`<div class="muted">Note: ${esc(r.note)}</div>`:''}${r.status=='pending'?`<button class="btn" data-ap="${r.id}">Approve</button><button class="btn danger" data-rj="${r.id}">Reject</button>`:''}</div>`).join(''):'<div class="card muted">No requests yet.</div>';
  h+=`</div><h3 style="margin:16px 0 8px">Parents</h3><div class="grid">`+(pars.length?pars.map(p=>`<div class="card"><b>${esc(p.name)}</b> <span class="pill">${esc(p.code)}</span><div class="muted">${esc(p.phone)} - ${esc(p.village||'')} ${esc(p.district)} - ${p.children} child${p.children==1?'':'ren'} linked</div></div>`).join(''):'<div class="card muted">No parents registered yet.</div>')+'</div>';
  app.innerHTML=h;
  const go=async(id,ok)=>{const n=prompt(ok?'Note for the parent (optional):':'Reason for rejecting:');if(n===null)return;try{const m=await phRpc('admin_resolve',{k:phKey,rid:id,approve:ok,n});if(m)alert(m);phScreen()}catch(e){alert(e.message)}};
  app.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>go(b.dataset.ap,true));app.querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>go(b.dataset.rj,false));
}
const LIVE={parenthub:phScreen,gh_songs:ghLive,sh_creators:shCreators,schools:schoolsLive,ds_schools:dsSchools,ds_requests:dsRequests,gh_updates:ghUpdates,gh_believers:ghBelievers,gh_safety:ghSafety,gh_activity:ghActivity,sh_content:shContent,sh_community:shCommunity,sh_support:shSupport,sh_admin:shAdmin};

render();loadFeed();
</script>
