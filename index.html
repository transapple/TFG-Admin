    <p id="pgMsg" class="pg-msg" role="status" aria-live="polite" hidden></p>
  </div>

<script>
(function(){
  var root = document.documentElement;
  var btn = document.getElementById("pgInstall");
  var cont = document.getElementById("pgContinue");
  var msg = document.getElementById("pgMsg");
  var deferred = null;
  var busy = false;

  function isStandalone(){
    try{
      return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
    }catch(e){ return false; }
  }

  function showMsg(text){
    msg.textContent = text;
    msg.hidden = false;
  }

  function setBusy(on, label){
    busy = on;
    btn.disabled = on;
    btn.textContent = on ? (label || "Working\u2026") : "Install";
  }

  async function doInstall(){
    if (busy) return;
    var p = deferred;
    if (!p) {
      var ua = navigator.userAgent;
      var isIOS = /iphone|ipad|ipod/i.test(ua);
      var isAndroid = /android/i.test(ua);
      var isChrome = /chrome|crios|edg/i.test(ua) && !/firefox|fxios/i.test(ua);
      if (isIOS) {
        showMsg('iPhone/iPad: tap the Share icon in Safari\u2019s toolbar, then "Add to Home Screen". Apple does not allow this to be triggered automatically \u2014 it\u2019s a one-time manual step.');
      } else if (isAndroid && isChrome) {
        showMsg('Already installed, or your browser hasn\u2019t offered the install prompt yet. Try: Chrome menu (\u22EE) \u2192 "Install app" / "Add to Home screen".');
      } else {
        showMsg('Open your browser menu and choose "Add to Home Screen" or "Install app".');
      }
      return;
    }
    deferred = null; // a prompt can only be used once
    try {
      setBusy(true, "Installing\u2026");
      p.prompt();
      var choice = await p.userChoice;
      if (choice && choice.outcome === "accepted") {
        showMsg("Installing\u2026 TFG Admin will appear on your home screen in a few moments.");
      } else {
        setBusy(false);
        showMsg("Install cancelled. You can install any time from your browser menu (\u22EE) \u2192 \u201CInstall app\u201D.");
      }
    } catch (err) {
      setBusy(false);
      showMsg('Couldn\u2019t start the install. Open your browser menu (\u22EE) and tap "Install app" or "Add to Home Screen".');
    }
  }

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferred = e;
  });
  window.addEventListener("appinstalled", function(){
    deferred = null;
    setBusy(true, "Installed \u2713");
    showMsg("TFG Admin is installed. Open it from your home screen.");
    setTimeout(function(){ root.classList.remove("pg-on"); }, 900);
  });

  btn.addEventListener("click", doInstall);
  cont.addEventListener("click", function(e){
    e.preventDefault();
    try { sessionStorage.setItem("pgContinue", "1"); } catch (err) {}
    root.classList.remove("pg-on");
  });

  if (isStandalone()) root.classList.remove("pg-on");
})();
</script>

<script>

(function(){
  let deferredPrompt = null;
  const installBtn = document.getElementById('installBtn');

  function showToast(msg, actionLabel, actionFn){
    const t = document.createElement('div');
    t.className = 'install-toast';
    t.innerHTML = '<span></span>';
    t.querySelector('span').textContent = msg;
    if(actionLabel){
      const b = document.createElement('button');
      b.textContent = actionLabel;
      b.onclick = () => { actionFn && actionFn(); t.remove(); };
      t.appendChild(b);
    }
    document.body.appendChild(t);

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    if(installBtn) installBtn.hidden = false;
  });

  if(installBtn){
    installBtn.addEventListener('click', async () => {
      if(!deferredPrompt){
        showToast('To install: open your browser menu and choose "Add to Home Screen".');

      }
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;

      installBtn.hidden = true;
      if(choice && choice.outcome === 'accepted'){
        showToast('Installed! Look for TFG Admin on your home screen.');

    });
  }

  window.addEventListener('appinstalled', () => {
    if(installBtn) installBtn.hidden = true;
    deferredPrompt = null;
  });

  if('serviceWorker' in navigator){

      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});

// ---------- LONG-PRESS ACTIONS (edit/delete popups) ----------
// Attaches a long-press gesture to items inside a container (event delegation,
// so it keeps working after the list's innerHTML is re-rendered). Taps on any
// <button> inside an item (e.g. "View full") are left alone as normal clicks.
function attachLongPress(containerEl, itemSelector, onLongPress){
  if(!containerEl || containerEl._longPressAttached) return;
  containerEl._longPressAttached = true;
  const THRESHOLD = 550, MOVE_TOL = 10;
  let timer=null, startX=0, startY=0, pointerId=null;
  function clear(){ if(timer){ clearTimeout(timer); timer=null; } pointerId=null; }
  containerEl.addEventListener("pointerdown", e=>{
    if(e.target.closest("button")) return;
    const item = e.target.closest(itemSelector); if(!item) return;
    pointerId=e.pointerId; startX=e.clientX; startY=e.clientY;
    timer=setTimeout(()=>{
      if(navigator.vibrate){ try{ navigator.vibrate(15); }catch(err){} }
      const id=item.dataset.id; clear(); onLongPress(id, item);
    }, THRESHOLD);
  });
  containerEl.addEventListener("pointermove", e=>{
    if(!timer||pointerId!==e.pointerId) return;
    if(Math.abs(e.clientX-startX)>MOVE_TOL || Math.abs(e.clientY-startY)>MOVE_TOL) clear();
  });
  containerEl.addEventListener("pointerup", clear);
  containerEl.addEventListener("pointercancel", clear);
  containerEl.addEventListener("contextmenu", e=>{ if(e.target.closest(itemSelector)) e.preventDefault(); });
}

  document.body.appendChild(bg);

// Uploads a data: URL to the shared "media" Storage bucket instead of writing base64
// straight into a Postgres text column, and returns the public URL to store instead.
async function uploadMedia(dataUrl, folder){
  if(!dataUrl || !dataUrl.startsWith("data:")) return dataUrl;
  try{
    const res = await fetch(dataUrl);
    const blob = await res.blob();
    const ext = (blob.type.split("/")[1]||"jpg").split("+")[0];
    const path = `${folder||"misc"}/admin_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}.${ext}`;
    const { error } = await sb.storage.from("media").upload(path, blob, { contentType:blob.type, upsert:true });
    if(error){ console.error("uploadMedia", error); return dataUrl; }
    const { data } = sb.storage.from("media").getPublicUrl(path);
    return data?.publicUrl || dataUrl;
  }catch(err){ console.error("uploadMedia", err); return dataUrl; }
}

// Next free song number in a language: one past whatever's already posted there,
// so a fresh post just continues the count — but it stays a normal editable field.
function nextSongNum(lang){
  const list = (songs[lang]||[]).map(s=>s.num).concat(getDrafts().filter(d=>d.lang===lang).map(d=>d.num));
  return list.length ? Math.max(...list)+1 : 1;
}

function buildLyrics(rows){
  let vNum=0, out=[];
  rows.forEach(r=>{
    if(!r.text.trim()) return;
    if(r.type==="chorus") out.push("Chorus\n"+r.text.trim());
    else { vNum++; out.push("Verse "+vNum+"\n"+r.text.trim()); }
  });
  return out.join("\n\n");
}

function showFab(onTap){

  fab.addEventListener("pointerdown", e=>{
    dragging=true; moved=false;
    const r=fab.getBoundingClientRect();
    startX=e.clientX; startY=e.clientY; origX=r.left; origY=r.top;
    try{ fab.setPointerCapture(e.pointerId); }catch(err){}
  });
  fab.addEventListener("pointermove", e=>{
    if(!dragging) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    if(Math.abs(dx)>6||Math.abs(dy)>6) moved=true;
    if(moved){
      fab.style.left=Math.max(6,Math.min(window.innerWidth-62,origX+dx))+"px";
      fab.style.top=Math.max(6,Math.min(window.innerHeight-62,origY+dy))+"px";
      fab.style.right="auto"; fab.style.bottom="auto";
    }
  });
  const endDrag = ()=>{ dragging=false; };
  fab.addEventListener("pointerup", endDrag);

  });

function parseLyrics(lyrics){
  if(!lyrics) return [{type:"verse",text:""}];
  const parsed = lyrics.split("\n\n").map(chunk=>{
    const lines = chunk.split("\n");
    const head = lines[0]||"";
    const type = /^chorus/i.test(head) ? "chorus" : "verse";
    return { type, text: lines.slice(1).join("\n") };
  }).filter(b=>b.text.trim());
  return parsed.length ? parsed : [{type:"verse",text:""}];
}

// ---------- AUTO-ORGANIZE (paste a whole song -> Verse 1, Chorus, Verse 2, ...) ----------
// Output is the same {type,text} block list the manual builder uses, so
// buildLyrics()/save/publish are completely unchanged.
function autoParseSong(raw){
  const notes = [];
  const text = String(raw||"").replace(/\r\n?/g,"\n").replace(/\u00a0/g," ");
  const lines = text.split("\n");
  const numRe  = /^\s*(?:verse\s*)?(\d{1,2})\s*[.):\-]?\s*$/i;            // "1" "1." "1)" "Verse 1"
  const numTxt = /^\s*(\d{1,2})\s*[.)]\s+(\S.*)$/;                        // "1. First line..."
  // Chorus words (any capitalization): English/Acholi/Luganda "Chorus", Alur "Koro", French "Chœur"/"Choeur" (+ existing "Refrain"/"Cho")
  const choRe  = /^\s*[\[(*_\s]*(?:repeat\s+)?(chorus|chœur|choeur|koro|refrain|cho)\b\.?\s*[\])*_]*\s*(?:x\s*\d+|\d+\s*x)?\s*(:|-|–)?\s*(.*)$/i;
  const clean = a => a.map(l=>l.trim()).filter(Boolean).join("\n");   // blank lines inside a block removed: blocks are joined by blank lines when saved
  const norm = t => t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu,"·").replace(/·/g," ").trim();
  // header test for a line: returns {rest} if it is a chorus header/marker
  const choHead = line => {
    const m = line.match(choRe); if(!m) return null;
    const rest = (m[3]||"").trim();
    return (!rest || m[2]) ? { rest } : null;   // "Chorus of angels sing" is NOT a header; "Chorus: ..." / "Chorus" alone is
  };
  const hasNumbers = lines.some(l=>numRe.test(l) || numTxt.test(l));

  // ---- 1. Split into sections ----
  // one line break = same section · two or more line breaks = new section (verse or chorus)
  // a number or a Chorus word on its own line always starts a section too, but is never required.
  const paras = text.split(/\n\s*\n/).map(p=>p.split("\n").filter(l=>l.trim()));
  const secs = []; const pre = []; let cur = null;
  const start = (type,num,labeled)=>{ cur = { type, num, labeled, lines:[] }; secs.push(cur); return cur; };
  paras.forEach(pl=>{
    if(!pl.length) return;
    if(cur && cur.lines.length) cur = null;   // blank-line boundary. (A lone "1" or "Chorus" with no words yet waits for the next block.)
    pl.forEach(line=>{
      let m;
      if((m = line.match(numRe))){ start("verse", parseInt(m[1],10), true); return; }
      const h = choHead(line);
      if(h){ start("chorus", null, true); if(h.rest) cur.lines.push(h.rest); return; }
      if((m = line.match(numTxt))){ start("verse", parseInt(m[1],10), true).lines.push(m[2].trim()); return; }
      if(!cur){
        if(hasNumbers && !secs.length){ pre.push(line); return; }   // text above the first numbered verse (e.g. a title): goes to review, not auto-added
        start("verse", null, false);                                // no label needed: the blank-line block is a section on its own
      }
      cur.lines.push(line);
    });
  });
  const items = secs.map(sc=>({ type:sc.type, num:sc.num, labeled:sc.labeled, text:clean(sc.lines) }));

  // ---- 2. No "Chorus"/"Koro"/"Chœur" word anywhere: a block that repeats word-for-word is the chorus ----
  if(!items.some(s=>s.type==="chorus")){
    const cnt = {}; let bestKey = "", bestN = 1;
    items.forEach(s=>{ if(s.labeled || !s.text) return; const k = norm(s.text); if(k) cnt[k] = (cnt[k]||0)+1; });
    items.forEach(s=>{ if(s.labeled || !s.text) return; const k = norm(s.text); if(cnt[k]>bestN){ bestN = cnt[k]; bestKey = k; } });
    if(bestKey){
      items.forEach(s=>{ if(!s.labeled && s.text && norm(s.text)===bestKey) s.type = "chorus"; });
      notes.push("No chorus label found — a block that repeats word-for-word was treated as the chorus. Please check.");
    }
  }

  // ---- 3. Build blocks in song order; the chorus is stored once, where it first occurs ----
  const blocks = []; let chorus = "", choCount = 0, dupCount = 0, diffCount = 0, vNum = 0, mismatch = false;
  items.forEach(s=>{
    if(s.type==="chorus"){
      choCount++;
      if(!s.text) return;                                   // just a "repeat chorus" marker
      if(!chorus){ chorus = s.text; blocks.push({type:"chorus", text:chorus}); }
      else if(norm(s.text)===norm(chorus)) dupCount++;
      else diffCount++;
      return;
    }
    if(!s.text) return;
    if(!s.labeled && chorus && norm(s.text)===norm(chorus)){ dupCount++; return; }   // unlabeled repeat of the chorus
    blocks.push({type:"verse", text:s.text}); vNum++;
    if(s.num && s.num!==vNum) mismatch = true;
  });
  if(dupCount) notes.push("Chorus appeared more than once — kept a single copy.");
  if(diffCount) notes.push("Found "+diffCount+" chorus block(s) with different wording — kept the first only. Check the chorus.");
  if(choCount && !chorus) notes.push("'Chorus' was marked but no chorus words were found — add them in the Chorus block.");
  if(mismatch) notes.push("Verse numbers in your text weren't 1,2,3… in order — they were renumbered by position.");
  return { blocks, notes, preface: clean(pre) };
}
let autoNotes = [];

window.runAutoOrganize = ()=>{
  const ta = document.getElementById("sPaste"); if(!ta) return;
  const raw = ta.value; if(!raw.trim()){ toast("Paste the full song first"); return; }
  const hasWork = blocks.some(b=>b.text.trim());

  const r = autoParseSong(raw);
  if(!r.blocks.length){ toast("Could not find any lyrics"); return; }
  blocks = r.blocks; autoNotes = r.notes; pendingPre = r.preface || "";

};

let uploadingDrafts = false;
async function uploadAllDrafts(auto){
  auto = (auto===true);
  if(uploadingDrafts) return;
  if(!navigator.onLine){ if(!auto) toast("You're offline. Connect to the internet first."); return; }
  const queue = getDrafts();
  if(!queue.length) return;
  uploadingDrafts = true;
  const btn = document.getElementById("uploadAllBtn"); if(btn){ btn.disabled = true; btn.textContent = "Uploading…"; }
  let ok = 0, failed = 0, stopped = false;
  for(const d of queue){
    if(!navigator.onLine){ stopped = true; break; }
    try{
      // Avoid duplicates if an earlier attempt reached the server but the reply was lost.
      const dup = await sb.from("songs").select("id").eq("lang_code", d.lang).eq("num", d.num).eq("title", d.title).limit(1);
      if(dup.error) throw dup.error;
      let row = dup.data && dup.data[0] ? null : undefined;
      if(row === undefined){
        const { data, error } = await sb.from("songs").insert({ lang_code:d.lang, num:d.num, title:d.title, key:d.key, lyrics:d.lyrics, snippet:d.snippet }).select().single();
        if(error) throw error;
        if(songs[d.lang]) songs[d.lang].push(songRowToObj(data));
      }
      // Remove only this draft, only after the server confirmed it.
      saveDrafts(getDrafts().filter(x=>x.id!==d.id));
      ok++;
      if(currentTab==="songs") renderSongs();   // synced draft disappears right away
    }catch(err){
      if(isNetworkError(err)){ stopped = true; break; }
      failed++;
      saveDrafts(getDrafts().map(x=>x.id===d.id ? Object.assign({}, x, { lastError:String(err.message||err) }) : x));
    }
  }
  uploadingDrafts = false;
  cacheSongsLocally();
  const left = getDrafts().length;
  if(auto){
    // Automatic runs stay quiet unless something actually synced.
    if(ok) toast(`${ok} draft${ok===1?"":"s"} synced automatically` + (left?` · ${left} still waiting`:""));
  } else {
    if(stopped) toast(`Connection lost. ${ok} uploaded, ${left} still in Drafts`);
    else if(failed) toast(`${ok} uploaded, ${failed} failed (kept in Drafts)`);
    else toast(`${ok} song${ok===1?"":"s"} uploaded`);
  }
  if(currentTab==="songs") renderSongs();
}

  const snippet = (lyrics.split("\n").find(l=>l && !/^verse|^chorus/i.test(l))||"").slice(0,60);
  if(!getDrafts().some(d=>d.id===id)){
    const bg0 = document.getElementById("songModalBg"); if(bg0) bg0.remove();

  toast("Draft updated"); renderSongs();
}

// ---- Activity feed: every like / comment / view on an update ----
let updActivity = [];
const ACT_SEEN_KEY = "tfg_upd_activity_seen";
function actLastSeen(){ try{ return Number(localStorage.getItem(ACT_SEEN_KEY))||0; }catch(e){ return 0; } }
function actUnseenCount(){ const t = actLastSeen(); return updActivity.filter(a=>a.ts>t).length; }
function markActivitySeen(){ try{ localStorage.setItem(ACT_SEEN_KEY, String(Date.now())); }catch(e){} renderActivityDot(); }
function renderActivityDot(){

function actTitle(id){ const u = updates.find(x=>x.id===id); return u ? (u.title||"Untitled update") : "an update"; }
function actText(a){
  const t = `"${actTitle(a.updateId)}"`;
  return a.kind==="like" ? `♥ A believer liked ${t}`
       : a.kind==="view" ? `👁 A believer viewed ${t}`
       : `💬 ${a.name||"A believer"} commented on ${t}: ${a.text.length>60?a.text.slice(0,60)+"…":a.text}`;

function makeActivity(kind, row){
  return { id: kind+":"+(row.id || (row.update_id+"|"+row.device_id)), kind, updateId:row.update_id, name:row.name, text:row.text||"", ts:new Date(row.created_at).getTime() };

async function loadUpdateActivity(){
  const [l,v,c] = await Promise.all([
    sb.from("update_likes").select("*").order("created_at",{ascending:false}).limit(25),
    sb.from("update_views").select("*").order("created_at",{ascending:false}).limit(25),
    sb.from("update_comments").select("*").order("created_at",{ascending:false}).limit(25)
  ]);
  if(l.error||v.error||c.error) return;   // engagement tables missing — skip quietly
  updActivity = [].concat((l.data||[]).map(r=>makeActivity("like",r)), (v.data||[]).map(r=>makeActivity("view",r)), (c.data||[]).map(r=>makeActivity("comment",r)))
    .sort((a,b)=>b.ts-a.ts).slice(0,60);
  renderActivityDot();
}
// Live: the moment anyone likes, views or comments, the admin is told.
function onUpdateActivity(kind, row){
  const a = makeActivity(kind, row);
  if(updActivity.some(x=>x.id===a.id)) return;
  updActivity.unshift(a); updActivity = updActivity.slice(0,60);
  const st = updStats[a.updateId] = updStats[a.updateId] || { likes:0, comments:0, views:0 };
  if(kind==="like") st.likes++; else if(kind==="view") st.views++; else st.comments++;
  if(currentTab==="updates"){ markActivitySeen(); renderUpdateList(); }
  else renderActivityDot();
  toast(actText(a));
}

// ---- Believers Connect profile details + verification mark ----
// This app has no sign-in. It holds the admin key itself and sends it with each request; the
// database only accepts these two functions (admin_believers_overview, admin_set_verified) with
// that key, so nobody else can give a mark. Keep this file private: anyone who can open it has
// full admin power. If you change the key in the database (admin_change_key), change it here too.
const ADMIN_KEY = "AAZC-GR32-DWTY-2X8Z";
let adminOverview = new Map();   // believer id -> overview row (only believers that have a linked profile)
let overviewLoaded = false;
let overviewAt = 0;
let overviewLoading = null;      // the load currently in flight, shared by everyone who asks
let overviewProblem = "";        // "key" = the database rejected ADMIN_KEY, otherwise an error message
function isUnauthorized(error){ return !!error && (error.code==="28000" || /unauthorized/i.test(error.message||"")); }
async function rpcSafe(fn, args){
  try{ const res = await sb.rpc(fn, args); return res || { data:null, error:{ message:"No response" } }; }
  catch(e){ return { data:null, error:{ message:"Offline — try again when connected" } }; }
}
function loadOverview(){
  if(overviewLoading) return overviewLoading;
  overviewLoading = (async()=>{
    const { data, error } = await rpcSafe("admin_believers_overview", { p_key:ADMIN_KEY });
    overviewLoading = null;
    if(error){ overviewLoaded = false; overviewProblem = isUnauthorized(error) ? "key" : (error.message||"Could not load"); return false; }
    adminOverview = new Map((data||[]).filter(r=>r && r.profile_id).map(r=>[String(r.believer_id), r]));
    overviewLoaded = true; overviewAt = Date.now(); overviewProblem = "";
    return true;
  })();
  return overviewLoading;
}
// Loads (or refreshes, at most once a minute) in the background so the blue checks show in the list.
async function refreshOverviewQuiet(){
  if(overviewLoaded && Date.now()-overviewAt < 60000) return;
  await loadOverview();
  if(currentTab==="believers" && belSub==="active" && document.getElementById("belList")) renderBelList();
}
async function setBelieverVerified(profileId, verified){
  const { data, error } = await rpcSafe("admin_set_verified", { p_key:ADMIN_KEY, p_profile:profileId, p_verified:!!verified });
  if(error){
    if(isUnauthorized(error)) return { ok:false, keyProblem:true, message:"the admin key in this app is out of date" };
    return { ok:false, message:error.message };
  }
  if(!data || !!data.verified !== !!verified) return { ok:false, message:"the database rejected the change" };
  return { ok:true, verified:!!data.verified, verified_at:data.verified_at||null };
}
async function setBelieverBadgeColor(profileId, color){
  const { data, error } = await rpcSafe("admin_set_badge_color", { p_key:ADMIN_KEY, p_profile:profileId, p_color:color });
  if(error){
    if(isUnauthorized(error)) return { ok:false, keyProblem:true, message:"the admin key in this app is out of date" };
    return { ok:false, message:error.message };
  }
  if(!data || (data.badge_color||"blue") !== color) return { ok:false, message:"the database rejected the change" };
  return { ok:true, badge_color:data.badge_color };
}

function renderBelievers(){
  const el = document.getElementById("main");
  el.innerHTML = `
  <div class="card">
    <div class="pills">
      <button class="pill ${belSub==="active"?"active":""}" data-s="active">Active</button>
      <button class="pill ${belSub==="restricted"?"active":""}" data-s="restricted">Restricted</button>
    </div>
    <div id="belBody"></div>

  el.querySelectorAll(".pills button").forEach(b=>b.onclick=()=>{ belSub=b.dataset.s; renderBelievers(); });
  document.getElementById("belBody").innerHTML = belSub==="active"
    ? `<h2>Active believers</h2><div class="muted" style="margin:2px 0 8px">Tap a believer to see their details and give or remove the verification mark. Long-press to suspend, ban, or delete.</div><div id="belList"></div>`
    : `<h2>Restricted (suspended, banned, deleted)</h2><p class="muted">Anyone here is blocked from registering again with the same phone, name, device, or pastor.</p><div id="restrList"></div>`;
  if(belSub==="active"){

}
// Same zigzag check the Believers Connect app draws next to verified accounts.
// Seven colours the admin can choose from (blue is the default).
const BADGE_COLORS = [
  { key:"blue",   label:"Blue",   hex:"#1E63E9" },
  { key:"red",    label:"Red",    hex:"#E53935" },
  { key:"green",  label:"Green",  hex:"#2E9E4F" },
  { key:"yellow", label:"Yellow", hex:"#F5B301" },
  { key:"orange", label:"Orange", hex:"#F57C00" },
  { key:"purple", label:"Purple", hex:"#8E44AD" },
  { key:"brown",  label:"Brown",  hex:"#8B5A2B" }
];
function badgeHex(key){ const c = BADGE_COLORS.find(x=>x.key===key); return c ? c.hex : BADGE_COLORS[0].hex; }
function vbadgeSvg(size, colorKey){
  const s = size||16, hex = badgeHex(colorKey), tick = colorKey==="yellow" ? "#4A3500" : "#fff";
  return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" role="img" aria-label="Verified account" focusable="false" style="vertical-align:-3px;margin-left:4px"><polygon points="12.00,0.30 14.48,2.73 17.85,1.87 18.79,5.21 22.13,6.15 21.27,9.52 23.70,12.00 21.27,14.48 22.13,17.85 18.79,18.79 17.85,22.13 14.48,21.27 12.00,23.70 9.52,21.27 6.15,22.13 5.21,18.79 1.87,17.85 2.73,14.48 0.30,12.00 2.73,9.52 1.87,6.15 5.21,5.21 6.15,1.87 9.52,2.73" fill="${hex}" stroke="${hex}" stroke-width="1" stroke-linejoin="round"/><path d="M7 12.5l3.3 3.3L17 9" fill="none" stroke="${tick}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function openBelieverDetail(id){
  const b = believers.find(x=>x.id===id); if(!b) return;
  const old = document.getElementById("belDetailBg"); if(old) old.remove();
  // One sheet; it redraws its own body in place, so no modal is opened or closed mid-flow and the
  // back-button handling is never disturbed.
  const bg = document.createElement("div"); bg.className="modalbg"; bg.id="belDetailBg";
  bg.innerHTML = `<div class="modal" style="max-width:340px"><div id="belSheetBody"></div></div>`;
  document.body.appendChild(bg);
  bg.onclick = e=>{ if(e.target===bg) bg.remove(); };
  const body = bg.querySelector("#belSheetBody");
  const row = (k,v)=> (v===null||v===undefined||v==="") ? "" : `<div style="display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)"><div class="muted" style="min-width:84px">${k}</div><div style="flex:1;word-break:break-word">${esc(v)}</div></div>`;
  const busy = btn=>{ btn.disabled=true; btn.style.opacity=".6"; };
  const stillOpen = ()=>document.body.contains(bg);

  function load(){
    const pr = loadOverview();            // shows the "Loading" state below while it runs
    showDetail();
    pr.then(()=>{
      if(document.getElementById("belList")) renderBelList();
      if(stillOpen()) showDetail();
    });
  }

  function showDetail(){
    const p = adminOverview.get(String(b.id)) || null;
    let verifyHtml;
    if(p){
      verifyHtml = `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0 8px"><strong style="font-size:15px">Verification</strong><span class="muted">${p.verified ? "Verified"+vbadgeSvg(14,p.badge_color) : "Not verified"}</span></div>
        ${p.verified && p.verified_at ? row("Verified on", fmtTs(p.verified_at)) : ""}
        <button class="btn ${p.verified?"btn-ghost":"btn-primary"}" id="belVerifyBtn" style="width:100%;margin-top:8px">${p.verified?"Remove verification mark":"Give verification mark"}</button>
        ${p.verified ? `<div style="margin:16px 0 8px"><strong style="font-size:15px">Badge colour</strong></div>
        <div id="belColors" style="display:flex;flex-wrap:wrap;gap:10px">${BADGE_COLORS.map(c=>{ const on=(p.badge_color||"blue")===c.key; return `<button type="button" class="belColorBtn" data-color="${c.key}" aria-label="${c.label}" title="${c.label}" style="display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid ${on?c.hex:"transparent"};background:${on?"rgba(128,128,128,.12)":"transparent"};border-radius:12px;padding:6px 6px 4px;min-width:52px;cursor:pointer;color:inherit;font:600 11px inherit">${vbadgeSvg(28,c.key).replace("margin-left:4px","margin-left:0")}<span>${c.label}</span></button>`; }).join("")}</div>` : ""}`;
    } else if(overviewLoaded){
      verifyHtml = `<div class="muted" style="margin-top:14px">This believer has no Believers Connect profile linked to their registration, so there is nothing to verify yet.</div>`;
    } else if(overviewLoading){
      verifyHtml = `<div class="muted" style="margin-top:14px">Loading profile details…</div>`;
    } else {
      const why = overviewProblem==="key"
        ? "The admin key saved in this app is out of date, so profile details can't load. Update ADMIN_KEY in the app file to match the database."
        : "Could not load profile details: "+(overviewProblem||"unknown problem");
      verifyHtml = `<div class="muted" style="margin:14px 0 8px">${esc(why)}</div>
        <button class="btn btn-primary" id="belRetryBtn" style="width:100%">Try again</button>`;
    }
    body.innerHTML = `
      <h2 style="margin-bottom:10px">${esc(b.name)}${p&&p.verified?vbadgeSvg(18,p.badge_color):""}</h2>
      ${row("Username", p&&p.username ? "@"+p.username : "")}
      ${row("Phone", b.phone)}
      ${row("Pastor", b.pastor)}
      ${row("Church", p&&p.church)}
      ${row("Bio", p&&p.bio)}
      ${row("Activity", p ? `${p.posts} posts · ${p.comments} comments · ${p.post_likes} likes · ${p.followers} followers · ${p.following} following` : "")}
      ${row("Device", b.device)}
      ${row("Status", b.status)}
      ${row("Registered", b.regTs ? fmtTs(b.regTs) : "")}
      ${row("Last seen", p&&p.last_seen ? fmtTs(p.last_seen) : "")}
      ${verifyHtml}
      <div class="actions" style="margin-top:14px"><button class="btn btn-ghost" id="belDetailClose" style="width:100%">Close</button></div>`;
    body.querySelector("#belDetailClose").onclick = ()=>bg.remove();
    const vb = body.querySelector("#belVerifyBtn");
    if(vb) vb.onclick = async()=>{
      busy(vb);
      const r = await setBelieverVerified(p.profile_id, !p.verified);
      if(!r.ok){ toast(r.keyProblem ? "Admin key in this app is out of date" : "Could not update verification: "+r.message); if(stillOpen()) showDetail(); return; }
      p.verified = r.verified; p.verified_at = r.verified_at;   // p lives in adminOverview, so the list badge follows
      toast(r.verified ? "Verification mark given" : "Verification mark removed");
      if(document.getElementById("belList")) renderBelList();
      if(stillOpen()) showDetail();
    };
    body.querySelectorAll(".belColorBtn").forEach(cb=>cb.onclick = async()=>{
      const color = cb.dataset.color;
      if((p.badge_color||"blue") === color) return;
      busy(cb);
      const r = await setBelieverBadgeColor(p.profile_id, color);
      if(!r.ok){ toast(r.keyProblem ? "Admin key in this app is out of date" : "Could not change colour: "+r.message); if(stillOpen()) showDetail(); return; }
      p.badge_color = r.badge_color;
      toast("Badge colour changed");
      if(document.getElementById("belList")) renderBelList();
      if(stillOpen()) showDetail();
    });
    const rb = body.querySelector("#belRetryBtn");
    if(rb) rb.onclick = ()=>{ busy(rb); load(); };
  }

  if(overviewLoaded) showDetail(); else load();
}
function renderBelList(){
  const list = believers.filter(b=>b.status==="active");
  document.getElementById("belList").innerHTML = list.length ? list.map(b=>{ const p=adminOverview.get(String(b.id)); return `
    <div class="list-item" data-id="${b.id}" style="cursor:pointer">
      <div class="top"><strong>${esc(b.name)}${p&&p.verified?vbadgeSvg(14,p.badge_color):""}</strong><span class="badge ${b.status}">${b.status}</span></div>
      <div class="muted">${esc(b.phone)} · ${esc(b.pastor)} · device ${esc(b.device)}</div>
    </div>`; }).join("") : `<div class="empty">No active believers.</div>`;
}
async function addRestriction(b, reason){
  const { data, error } = await sb.from("restricted").insert({ name:b.name, phone:b.phone, pastor:b.pastor, device:b.device, reason }).select().single();
  if(error){ toast("Could not add restriction: "+error.message); return; }
  restricted.unshift(restrictedRowToObj(data));
}
window.setStatus=async(id,status)=>{
  const b = believers.find(x=>x.id===id); if(!b) return;
  const { error } = await sb.from("believers").update({ status }).eq("id", id);
  if(error){ toast("Could not update status: "+error.message); return; }
  b.status = status;
  if(status==="suspended"||status==="banned") await addRestriction(b, status);
  toast("Status updated"); renderBelievers();
};
window.deleteBeliever=async(id)=>{
  const b = believers.find(x=>x.id===id); if(!b) return;
  await addRestriction(b, "deleted");
  const { error } = await sb.from("believers").delete().eq("id", id);
  if(error){ toast("Could not delete believer: "+error.message); return; }
  believers = believers.filter(x=>x.id!==id);
  toast("Believer deleted and blocked from re-registering"); renderBelievers();
};
function renderRestrList(){
  document.getElementById("restrList").innerHTML = restricted.length ? restricted.map(r=>`
    <div class="list-item">
      <div class="top"><strong>${esc(r.name)}</strong><span class="badge banned">${r.reason}</span></div>
      <div class="muted">${esc(r.phone)} · ${esc(r.pastor)} · device ${esc(r.device)}</div>
      <div class="actions"><button class="btn btn-ghost btn-sm" onclick="unrestrict('${r.id}')">Restore &amp; remove restriction</button></div>
    </div>`).join("") : `<div class="empty">No one is restricted right now.</div>`;
}
window.unrestrict=async(id)=>{
  const r = restricted.find(x=>x.id===id); if(!r) return;
  const b = believers.find(x=>x.phone===r.phone || x.device===r.device);
  if(b){
    const { error } = await sb.from("believers").update({ status:"active" }).eq("id", b.id);
    if(error){ toast("Could not restore believer: "+error.message); return; }
    b.status="active";
  } else if(r.reason==="deleted"){
    const { data, error } = await sb.from("believers").insert({ name:r.name, phone:r.phone, pastor:r.pastor, device:r.device, status:"active" }).select().single();
    if(error){ toast("Could not restore believer: "+error.message); return; }
    believers.push(believerRowToObj(data));
  }
  const { error:delErr } = await sb.from("restricted").delete().eq("id", id);
  if(delErr){ toast("Could not clear restriction: "+delErr.message); return; }
  restricted = restricted.filter(x=>x.id!==id);
  toast("Restriction removed"); renderBelievers();
};
// The main app (a separate file) queries the `restricted` table directly with
// this same match logic before letting anyone register or re-register.
window.isRestricted=(phone,name,device,pastor)=> restricted.some(r=>
  (phone && r.phone===phone) || (name && r.name===name) || (device && r.device===device) || (pastor && r.pastor===pastor));

// ---------- TRENDS ----------
// Reads the `usage_events` rows the main Only Believe Gospel Hymns app writes:
// kind "open" (an app launch/return — one per session, used for daily-used and
// history counts), kind "heartbeat" (still in foreground, tagged with the
// feature/screen in view, sent every 25s — used for "currently active", total
// time, and time-per-feature), kind "install" (added to home screen, logged
// once per device). History is kept for good — nothing here is ever auto-deleted.
const HEARTBEAT_SECONDS = 25; // must match the main app's heartbeat interval
const ACTIVE_WINDOW_MS = 90*1000; // a device counts as "using it right now" if it pinged within this window
const HISTORY_DAYS = 30; // default rolling window shown in the History list
let trendsTimer = null;
let trendsLoading = false;

function startOfDay(t){ const d = new Date(t); d.setHours(0,0,0,0); return d; }
function dayKey(t){ return startOfDay(t).toISOString().slice(0,10); }
function fmtDuration(totalSeconds){
  const h = Math.floor(totalSeconds/3600), m = Math.round((totalSeconds%3600)/60);
  return h>0 ? `${h}h ${m}m` : `${m}m`;
}
function fmtFeatureName(f){
  const names = { home:"Home", hymns:"Hymns", updates:"Updates", more:"More",
    believers_connect:"Believers Connect", testimony_wall:"Testimony Wall", chat:"Chat" };
  return names[f] || (f ? f.charAt(0).toUpperCase()+f.slice(1) : "Unknown");
}
function fmtDayLabel(key){
  const today = dayKey(Date.now());
  const yesterday = dayKey(Date.now()-24*3600*1000);
  if(key===today) return "Today";
  if(key===yesterday) return "Yesterday";
  const d = new Date(key+"T00:00:00");
  return d.toLocaleDateString([], { weekday:"short", month:"short", day:"numeric", year:"numeric" });
}
// Count of distinct devices per kind, for one or more days, in one query.
async function countByDay(kinds, fromIso, toIso){
  let q = sb.from("usage_events").select("device_id,kind,ts").in("kind", kinds).gte("ts", fromIso);
  if(toIso) q = q.lt("ts", toIso);
  const { data, error } = await q;
  if(error) return { error };
  const byDay = {}; // "YYYY-MM-DD" -> { [kind]: Set(device_id) }
  (data||[]).forEach(r=>{
    const key = dayKey(r.ts);
    if(!byDay[key]) byDay[key] = {};
    if(!byDay[key][r.kind]) byDay[key][r.kind] = new Set();
    byDay[key][r.kind].add(r.device_id);
  });
  return { byDay };
}
async function loadTrendsData(){
  const now = Date.now();
  const todayStartIso = startOfDay(now).toISOString();
  const activeCutoffIso = new Date(now - ACTIVE_WINDOW_MS).toISOString();
  const historySinceIso = startOfDay(now - (HISTORY_DAYS-1)*24*3600*1000).toISOString();

  const [todayRes, activeRes, installRes, historyRes] = await Promise.all([
    sb.from("usage_events").select("device_id,kind,feature,ts").gte("ts", todayStartIso),
    sb.from("usage_events").select("device_id").in("kind",["open","heartbeat"]).gte("ts", activeCutoffIso),
    sb.from("usage_events").select("device_id").eq("kind","install"),
    countByDay(["open","install"], historySinceIso)
  ]);
  const firstErr = todayRes.error || activeRes.error || installRes.error || historyRes.error;
  if(firstErr){ toast("Could not load trends: "+firstErr.message); return null; }

  const todayRows = todayRes.data||[];
  const activeToday = new Set(todayRows.filter(r=>r.kind==="open").map(r=>r.device_id)).size;
  const currentlyActive = new Set((activeRes.data||[]).map(r=>r.device_id)).size;
  const totalInstalls = new Set((installRes.data||[]).map(r=>r.device_id)).size;

  const heartbeatsToday = todayRows.filter(r=>r.kind==="heartbeat");
  const totalSecondsToday = heartbeatsToday.length * HEARTBEAT_SECONDS;

  const featureSeconds = {};
  heartbeatsToday.forEach(r=>{
    const f = r.feature || "home";
    featureSeconds[f] = (featureSeconds[f]||0) + HEARTBEAT_SECONDS;
  });
  const featureList = Object.entries(featureSeconds).sort((a,b)=>b[1]-a[1]);

  const history = [];
  for(let i=0;i<HISTORY_DAYS;i++){
    const key = dayKey(now - i*24*3600*1000);
    const day = historyRes.byDay[key] || {};
    history.push({ key, used:(day.open?day.open.size:0), installed:(day.install?day.install.size:0) });
  }

  return { activeToday, currentlyActive, totalInstalls, totalSecondsToday, featureList, history };
}
// Looks up one specific date (any date at all — history is never deleted).
async function lookupUsageForDate(dateStr){
  const from = new Date(dateStr+"T00:00:00");
  const to = new Date(from.getTime()+24*3600*1000);
  const { data, error } = await sb.from("usage_events").select("device_id,kind")
    .in("kind",["open","install"]).gte("ts", from.toISOString()).lt("ts", to.toISOString());
  if(error){ toast("Could not look up that date: "+error.message); return null; }
  const used = new Set((data||[]).filter(r=>r.kind==="open").map(r=>r.device_id)).size;
  const installed = new Set((data||[]).filter(r=>r.kind==="install").map(r=>r.device_id)).size;
  return { used, installed };
}
function renderTrends(){
  const el = document.getElementById("main");
  const todayStr = dayKey(Date.now());
  el.innerHTML = `
  <div class="card" id="trendsStats"><h2>Right now</h2><div class="empty">Loading…</div></div>
  <div class="card" id="trendsFeatures"><h2>Where time goes today</h2><div class="empty">Loading…</div></div>
  <div class="card" id="trendsHistory">
    <h2>History</h2>
    <div class="row" style="align-items:flex-end;margin-bottom:10px">
      <div><label>Look up a date</label><input type="date" id="histDate" max="${todayStr}"></div>
      <div style="flex:0 0 auto"><button class="btn btn-primary btn-sm" id="histSearchBtn">Search</button></div>
    </div>
    <div id="histSearchResult"></div>
    <div id="histList"><div class="empty">Loading…</div></div>
  </div>`;
  document.getElementById("histSearchBtn").onclick = async ()=>{
    const v = document.getElementById("histDate").value;
    if(!v){ toast("Pick a date first"); return; }
    const r = await lookupUsageForDate(v);
    if(!r) return;
    document.getElementById("histSearchResult").innerHTML =
      `<div class="list-item"><strong>${esc(fmtDayLabel(v))}</strong><div class="muted" style="margin-top:4px">${r.used} used it that day · ${r.installed} installed that day</div></div>`;
  };
  refreshTrends();
  if(trendsTimer) clearInterval(trendsTimer);
  trendsTimer = setInterval(refreshTrends, 20000);
}
function stopTrendsRefresh(){ if(trendsTimer){ clearInterval(trendsTimer); trendsTimer=null; } }
async function refreshTrends(){
  if(trendsLoading) return; trendsLoading = true;
  const stats = await loadTrendsData();
  trendsLoading = false;
  if(!stats || currentTab!=="trends") return;

  document.getElementById("trendsStats").innerHTML = `
    <h2>Right now</h2>
    <div class="tstat-grid">
      <div class="tstat"><div class="tstat-num">${stats.currentlyActive}</div><div class="tstat-label">using it right now</div></div>
      <div class="tstat"><div class="tstat-num">${stats.activeToday}</div><div class="tstat-label">used it today</div></div>
      <div class="tstat"><div class="tstat-num">${fmtDuration(stats.totalSecondsToday)}</div><div class="tstat-label">total time today</div></div>
      <div class="tstat"><div class="tstat-num">${stats.totalInstalls}</div><div class="tstat-label">have installed (all-time)</div></div>
    </div>
    <p class="muted" style="margin-top:10px">Refreshes automatically every 20 seconds while this tab is open.</p>`;

    <h2>Where time goes today</h2>
    ${stats.featureList.length ? renderFeatureBars(stats.featureList) : '<div class="empty">No activity yet today.</div>'}`;

  document.getElementById("histList").innerHTML = renderHistoryList(stats.history);
}
function renderFeatureBars(list){
  const max = Math.max(...list.map(([,s])=>s), 1);
  return `<div class="trend-bars">` + list.map(([feature,secs])=>`
    <div class="trend-bar-row">
      <div class="trend-bar-label">${esc(fmtFeatureName(feature))}</div>
      <div class="trend-bar-track"><div class="trend-bar-fill" style="width:${Math.max(4,(secs/max*100))}%"></div></div>
      <div class="trend-bar-val">${fmtDuration(secs)}</div>
    </div>`).join("") + `</div>`;
}
function renderHistoryList(history){
  return `<div class="hist-list">` + history.map(d=>`
    <div class="hist-row">
      <div class="hist-day">${esc(fmtDayLabel(d.key))}</div>
      <div class="hist-nums"><span title="Used it that day">${d.used} used</span><span title="Installed that day">${d.installed} installed</span></div>
    </div>`).join("") + `</div>`;
}

// ---------- MODAL SCROLL CONTROLLER ----------
// A visible drag handle on the modal's right edge that scrolls the form
// directly by setting scrollTop from pointer position — this works even in
// places where touch/swipe scrolling on the modal itself is unreliable.
// The actual scrollable area is an inner wrapper (.modal-scroll) that we
// move the modal's real content into; the track+thumb stay OUTSIDE that
// wrapper, as plain siblings of it, so they stay fixed at the modal's right
// edge instead of scrolling away with the content underneath them.
function setupModalScrollbar(modalEl){
  if(!modalEl || modalEl._scrollbarSetup) return;
  modalEl._scrollbarSetup = true;

  const inner = document.createElement("div"); inner.className = "modal-scroll";
  while(modalEl.firstChild) inner.appendChild(modalEl.firstChild);
  modalEl.appendChild(inner);

  const track = document.createElement("div"); track.className = "modal-scrollbar";
  const thumb = document.createElement("div"); thumb.className = "modal-scrollbar-thumb";
  track.appendChild(thumb);
  modalEl.appendChild(track);

  function thumbHeight(){
    const trackH = track.clientHeight, contentH = inner.scrollHeight, viewH = inner.clientHeight;
    if(contentH<=0) return trackH;
    return Math.min(trackH, Math.max(28, trackH*(viewH/contentH)));
  }
  function refresh(){
    const trackH = track.clientHeight, contentH = inner.scrollHeight, viewH = inner.clientHeight;
    if(contentH <= viewH + 1){ track.style.display = "none"; return; }
    track.style.display = "block";
    const th = thumbHeight();
    const maxTop = trackH - th;
    const ratio = maxTop>0 ? (inner.scrollTop/(contentH-viewH)) : 0;
    thumb.style.height = th+"px";
    thumb.style.transform = "translateY("+(ratio*maxTop)+"px)";
  }
  function currentThumbTop(){
    const m = /translateY\(([-\d.]+)px\)/.exec(thumb.style.transform);
    return m ? parseFloat(m[1]) : 0;
  }
  function scrollToThumbTop(top){
    const trackH = track.clientHeight, contentH = inner.scrollHeight, viewH = inner.clientHeight;
    const th = thumbHeight();
    const maxTop = trackH - th;
    const clamped = Math.max(0, Math.min(maxTop, top));
    inner.scrollTop = maxTop>0 ? (clamped/maxTop)*(contentH-viewH) : 0;
    refresh();
  }

  let dragging=false, pointerId=null, dragStartY=0, dragStartTop=0;
  function beginDrag(e, jumpToPointer){
    dragging=true; pointerId=e.pointerId;
    if(jumpToPointer){
      // Tapping straight on the track (not the thumb) snaps the handle to
      // the fingertip immediately, so it's under your finger from the very
      // first touch instead of you having to go hunt for it.
      const rect = track.getBoundingClientRect();
      scrollToThumbTop((e.clientY-rect.top) - thumbHeight()/2);
    }
    dragStartY=e.clientY; dragStartTop=currentThumbTop();
    e.preventDefault(); e.stopPropagation();
  }
  const onMove = e=>{ if(!dragging || pointerId!==e.pointerId) return; scrollToThumbTop(dragStartTop+(e.clientY-dragStartY)); };
  const onEnd = ()=>{ dragging=false; pointerId=null; };

  thumb.addEventListener("pointerdown", e=>{ beginDrag(e,false); try{ thumb.setPointerCapture(e.pointerId); }catch(err){} });
  thumb.addEventListener("pointermove", onMove);
  thumb.addEventListener("pointerup", onEnd);
  thumb.addEventListener("pointercancel", onEnd);

  track.addEventListener("pointerdown", e=>{
    if(e.target===thumb) return;
    beginDrag(e,true);
    try{ track.setPointerCapture(e.pointerId); }catch(err){}
  });
  track.addEventListener("pointermove", onMove);
  track.addEventListener("pointerup", onEnd);
  track.addEventListener("pointercancel", onEnd);

  inner.addEventListener("scroll", refresh);
  window.addEventListener("resize", refresh);
  try{ new ResizeObserver(refresh).observe(inner); }catch(e){}
  try{ new MutationObserver(refresh).observe(inner, { childList:true, subtree:true, characterData:true }); }catch(e){}
  refresh();
}

// ---------- DEVICE BACK BUTTON ----------
// Every modal/popup in this app (song editor, update composer, view-update,
// the long-press action popup, inbound report/complaint popup) is a plain
// <div class="modalbg"> appended to <body> and removed with .remove() — so a
// single MutationObserver here gives all of them back-button support without
// touching each opener individually. Back also steps through visited tabs
// before finally leaving the app, instead of exiting immediately.
//
// Some actions (e.g. tapping "Edit" in a long-press popup) remove one modal
// and immediately open another in the very same synchronous step — both
// changes land in the SAME batch of mutation records here. We tally the
// net change (added minus removed) for that whole batch rather than acting
// on each record alone: a straight swap (net 0) leaves the history depth
// untouched, which is what avoids a delayed history.back() racing with the
// newly-opened modal and closing it again right after it appears.
let backNavigating = false; // true while we're reacting to a popstate (avoids re-pushing/re-popping)
try{ history.replaceState({ adminTab:"songs" }, "", location.href); }catch(e){}
new MutationObserver(muts=>{
  let added = 0, removed = 0;
  muts.forEach(m=>{
    m.addedNodes.forEach(n=>{
      if(n.nodeType===1 && n.classList && n.classList.contains("modalbg")){
        const modalEl = n.querySelector(".modal");
        if(modalEl) setupModalScrollbar(modalEl);
        added++;
      }
    });
    m.removedNodes.forEach(n=>{
      if(n.nodeType===1 && n.classList && n.classList.contains("modalbg")) removed++;
    });
  });
  if(backNavigating) return;
  const net = added - removed;
  if(net > 0){
    for(let i=0;i<net;i++){ try{ history.pushState({ adminModal:true }, "", location.href); }catch(e){} }
  } else if(net < 0 && history.state && history.state.adminModal){
    try{ history.back(); }catch(e){}
  }
}).observe(document.body, { childList:true });
window.addEventListener("popstate", e=>{
  backNavigating = true;
  const openModal = document.querySelector(".modalbg");
  if(openModal){
    openModal.remove();
  } else {
    const target = (e.state && e.state.adminTab) || "songs";
    if(target !== currentTab){
      const btn = document.querySelector(`#tabs button[data-t="${target}"]`);
      if(btn) btn.click();
    }
  }
  setTimeout(()=>{ backNavigating=false; }, 0);
});

// ---------- TAB SWITCH ----------
let currentTab = "songs";
const renderers = { songs:renderSongs, updates:renderUpdates, believers:renderBelievers, reports:renderReports, trends:renderTrends };
document.getElementById("tabs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  const prevTab = currentTab;
  currentTab = b.dataset.t;
  if(!backNavigating){ try{ history.pushState({ adminTab:currentTab }, "", location.href); }catch(e){} }
  if(b.dataset.t!=="songs" && b.dataset.t!=="updates") removeFab();
  if(prevTab==="trends" && b.dataset.t!=="trends") stopTrendsRefresh();
  renderers[b.dataset.t]();
});

// ---------- BELL: unread badge + pop-up for incoming reports/complaints ----------
function renderBell(){
  const openCount = reports.filter(r=>r.status==="open").length;
  const dot = document.getElementById("bellDot");
  if(openCount>0){ dot.style.display="inline-block"; dot.textContent = openCount>9?"9+":openCount; }
  else dot.style.display="none";
}
document.getElementById("bellBtn").onclick = ()=>{
  document.querySelector('#tabs button[data-t="reports"]').click();
  reportSub = "reports";
  renderReports();
};
function showInboundPopup(n){
  const bg = document.createElement("div"); bg.className="modalbg";
  bg.innerHTML = `<div class="modal">
    <h2>${n.kind==="complaint" ? "New complaint" : "New report"}</h2>
    <p>${esc(n.text || n.postText || "")}</p>
    <p class="muted">${fmtTs(n.ts)}</p>
    <div class="actions">
      <button class="btn btn-primary btn-sm" id="popView">View</button>
      <button class="btn btn-ghost btn-sm" id="popClose">Dismiss</button>
    </div>
  </div>`;
  document.body.appendChild(bg);
  bg.querySelector("#popClose").onclick=()=>bg.remove();
  bg.querySelector("#popView").onclick=()=>{ bg.remove(); document.getElementById("bellBtn").click(); };
  bg.onclick=e=>{ if(e.target===bg) bg.remove(); };
}
let seenInboxIds = new Set();
function handleFreshReportRow(row){
  const r = reportRowToObj(row);
  if(seenInboxIds.has(r.id)) return;
  seenInboxIds.add(r.id);
  reports = reports.filter(x=>x.id!==r.id);
  reports.unshift(r);
  if(r.status==="open") showInboundPopup(r);
  renderBell();
  if(currentTab==="reports") renderReports();
}
// Live push instead of polling: new reports (from a "Report" tap or the complaints
// flow in the main app) arrive over Supabase Realtime the moment they're inserted.
sb.channel("admin_reports")
  .on("postgres_changes", { event:"INSERT", schema:"public", table:"reports" }, payload=>handleFreshReportRow(payload.new))
  .subscribe();

sb.channel("admin_update_activity")
  .on("postgres_changes", { event:"INSERT", schema:"public", table:"update_likes" },    p=>onUpdateActivity("like", p.new))
  .on("postgres_changes", { event:"INSERT", schema:"public", table:"update_views" },    p=>onUpdateActivity("view", p.new))
  .on("postgres_changes", { event:"INSERT", schema:"public", table:"update_comments" }, p=>onUpdateActivity("comment", p.new))
  .subscribe();

// ---------- STARTUP: pull everything from Supabase, then draw the first tab ----------
(async function init(){
  await Promise.all([loadSongs(), loadUpdates(), loadBelievers(), loadRestricted(), loadReports(), loadOutbox()]);
  seenInboxIds = new Set(reports.map(r=>r.id));
  renderers[currentTab]();
  renderBell();
  autoSyncDrafts();
})();
</script>
